[env:esp32-s3-devkitc1-n16r8]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@^7.2.2
	adafruit/Adafruit NeoPixel@^1.15.4

build_flags =
    -D DEFAULT_API_URL=\"\"